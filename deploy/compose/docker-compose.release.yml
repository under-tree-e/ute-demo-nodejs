services:
  ute-demo-nodejs:
    image: ${IMAGE_REF:?IMAGE_REF must be an immutable GHCR digest}
    container_name: ute-demo-nodejs
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE must point to the Vault Agent rendered file}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.ute-demo-nodejs.entrypoints=https
      - traefik.http.routers.ute-demo-nodejs.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST is required}`)
      - traefik.http.routers.ute-demo-nodejs.tls=true
      - traefik.http.services.ute-demo-nodejs.loadbalancer.server.port=3000
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?TRAEFIK_NETWORK is required}
